version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: financial_db
    restart: always
    environment:
      MYSQL_DATABASE: financial_assistant
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_USER: assistant_user
      MYSQL_PASSWORD: userpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: financial_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://assistant_user:userpassword123@db/financial_assistant
      - SECRET_KEY=b3a4c49d8c0b5f1f912e93b1d3d63c5d6f1a8c9e4b7e8d9c0a1b2c3d4e5f6a7b
      - OPENAI_API_KEY=AQ.Ab8RN6JARvLawpRxcxfirdd5ge-E3HuLYPPFLktH5jqQ1-zqGg
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: financial_frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  mysql_data:
