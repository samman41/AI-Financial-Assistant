version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: financial_db
    restart: always
    environment:
      MYSQL_DATABASE: financial_assistant
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_USER: assistant_user
      MYSQL_PASSWORD: userpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: financial_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://assistant_user:${DB_PASSWORD}@db/financial_assistant
      - SECRET_KEY=my-secret-key
      - OPENAI_API_KEY=my-openai-key
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: financial_frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  mysql_data:
